/* Subtle scroll reveal: fade + gentle rise, 0.5s, once */

.reveal{
  opacity:0;
  transform: translateY(12px);
  transition: opacity 0.5s ease-out, transform 0.5s ease-out;
  will-change: opacity, transform;
}

.reveal.in{
  opacity:1;
  transform: translateY(0);
}

.gold-gradient{
  background: linear-gradient(135deg, #FFC107 0%, #FFB300 100%);
  transition: filter 0.25s ease, transform 0.25s ease;
}

.gold-gradient:hover{
  filter: brightness(0.97);
}

.navy-glow{
  box-shadow: 0 20px 60px rgba(10,25,49,0.12);
}

.card-lift{
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}

.card-lift:hover{
  box-shadow: 0 12px 32px rgba(10,25,49,0.10);
  transform: translateY(-3px);
}

.btn-hover{
  transition: background-color 0.25s ease, filter 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
}

.btn-hover:hover{
  filter: brightness(0.98);
  transform: scale(1.02);
}

.page-enter{
  animation: pageFadeIn 0.32s ease-out both;
}

@keyframes pageFadeIn{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@media (prefers-reduced-motion: reduce){
  html{
    scroll-behavior: auto;
  }

  .reveal{
    opacity:1 !important;
    transform:none !important;
    transition:none !important;
  }

  .gold-gradient, .navy-glow, .card-lift, .btn-hover{
    transition:none !important;
    animation:none !important;
  }

  .page-enter{
    animation:none !important;
  }

  .whatsapp-pulse-ring{
    animation:none !important;
  }
}

@keyframes whatsapp-pulse {
  0% {
    transform: scale(1);
    opacity: 0.7;
  }

  50% {
    transform: scale(1.15);
    opacity: 0;
  }

  100% {
    transform: scale(1.15);
    opacity: 0;
  }
}

.whatsapp-pulse-ring{
  animation: whatsapp-pulse 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
}
